<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#cf4a00" />
    <title>You are offline · Tilza</title>
    <style>
      :root {
        color-scheme: light;
        --background: #fffaf4;
        --card: #ffffff;
        --foreground: #1c1917;
        --muted: #78716c;
        --border: #e7e0d8;
        --primary: #cf4a00;
        --primary-foreground: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--background);
        color: var(--foreground);
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--card);
        padding: 32px 28px;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 1.6rem;
        line-height: 1.2;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.5;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 24px;
        min-height: 44px;
        padding: 0 22px;
        border-radius: 8px;
        background: var(--primary);
        color: var(--primary-foreground);
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png?v=2" alt="" width="64" height="64" />
      <h1>You are offline.</h1>
      <p>
        Reconnect to load the latest page. If you were ordering, your basket stays on this device
        and the shop&apos;s WhatsApp chat will work once you are back online.
      </p>
      <a href="/">Open Tilza</a>
    </main>
  </body>
</html>
