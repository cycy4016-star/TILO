name: Weekly digest

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send merchant digest
        env:
          URL: ${{ format('{0}/api/cron/weekly-digest', vars.PRODUCTION_URL || 'https://tilo-production-81c6.up.railway.app') }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET is not set"
            exit 1
          fi
          curl -fsS -m 60 --retry 2 -X POST "${URL}" \
            -H "Authorization: Bearer ${CRON_SECRET}"
