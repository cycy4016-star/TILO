# Railway: migrate on boot (build containers often lack private-network DB
# access, so migrations run at start, not at build), then serve. $PORT is
# injected by Railway; the default keeps `next start` local behaviour.
[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "node scripts/boot-migrate.mjs && next start -p $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
